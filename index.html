<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>The Board Room</title>
    <meta name="theme-color" content="#F2F1EB" />
    <meta name="description" content="Your command center — markets, ventures, board of advisors, and the day's brief." />
    <!-- Private tool behind a login — nothing here should be crawled or indexed. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Preload the house typeface (Inter, self-hosted) so first paint already
         has it — no swap flicker. crossorigin is required even same-origin. -->
    <link rel="preload" href="/fonts/inter-var-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- "black". NOT "black-translucent", and NOT "default". All three have now
         been tried on device; this comment is the record, because the losing two
         both look correct in code and fail only on a phone.

         · "black-translucent" — the app paints the strip itself, which is the
           only way to get rid of the seam described below. It is also STILL
           BROKEN on current iOS, exactly as it was when this note was first
           written: the window is sized as though the status bar were opaque
           (screen − 59pt) but anchored at y=0, so the app pays for the strip
           TWICE — once reserving env(safe-area-inset-top) at the top, and again
           as a dead 59pt band at the bottom of the screen. On device that band
           is a big empty chin under the tab bar. Nothing inside the window can
           fix it; you cannot render outside your own window. MobileShell's
           `letterboxed` detection and the .lbx collapse do catch it and tighten
           the tab bar, which is worth keeping, but they cannot fill the band.
           This was tried again in 2026 on the theory that iOS had fixed it. It
           had not. Do not spend a third attempt without a device to test on.

         · "default" — a WHITE cap with dark glyphs, per Apple's own reference.
           Fine over a light palette and indefensible over a dark one.

         · "black" is the least-bad: the window sits below the status bar, so
           there is NO letterbox and the tab bar reaches the physical bottom.
           The cost is that iOS paints the strip flat black and the app never
           sees it — invisible on a near-black palette, a visible seam over a
           lighter dark ground (Slate's night is #1F2329), and a hard black bar
           over any light ground. That seam is genuinely not reachable from CSS:
           with "black", env(safe-area-inset-top) is 0 and the strip is outside
           the web view entirely.

         ONE THING THE FAILED ATTEMPT DID SETTLE, and it is worth keeping: under
         black-translucent this iOS drew DARK status-bar glyphs over the light
         palette, not the white ones Apple documents. It follows the page's
         `color-scheme`, which every palette already declares. So a scrim to keep
         white glyphs legible — which is what .statuscap grew and what made the
         top of the light theme look smeared — was solving a problem that does
         not exist. If black-translucent is ever revisited, it needs no scrim.

         iOS reads this at Add-to-Home-Screen time ONLY: an already-installed
         icon must be DELETED and RE-ADDED for a change here to take effect. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Board Room" />
    <script>
      // Resolve the room's theme before first paint — no flash, ever.
      // Mirrors resolveTheme() in src/theme.js; keep the two in sync.
      (function () {
        var t = "day";
        try {
          var p = localStorage.getItem("br_theme") || "auto";
          if (p === "day" || p === "night") t = p;
          // Must match resolveTheme() in src/theme.js exactly, or React repaints
          // a different theme after hydration (a flash). matchMedia is
          // authoritative in BOTH directions when present; the sun-based hour
          // fallback is only for browsers without matchMedia.
          else if (window.matchMedia) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "day";
          else { var h = new Date().getHours(); t = (h >= 19 || h < 7) ? "night" : "day"; }
        } catch (e) {}
        // The palette is the second axis (20 colour schemes; see
        // src/design/themes.css). It only needs the ATTRIBUTE set here — the
        // values live in CSS, so no palette data has to be duplicated into this
        // script and there's nothing to drift. If it were applied from JS after
        // hydration instead, every relaunch of a non-default theme would paint
        // Porcelain for a frame first, which on an installed PWA is a visible
        // flash on every single open.
        var pal = "porcelain";
        try { pal = localStorage.getItem("br_palette") || "porcelain"; } catch (e) {}
        var root = document.documentElement;
        root.setAttribute("data-theme", t);
        root.setAttribute("data-palette", pal);
        // theme-color paints the strip behind the iOS status bar on an installed
        // app, so a wrong value here is a visible seam at the top of the screen
        // for the whole first frame. It CANNOT be read from the cascade: Vite
        // emits the stylesheet link after this script, so getComputedStyle
        // returns empty at this point in both dev and production. Hence the
        // grounds are inlined — generated, never hand-edited, and theme-smoke
        // fails the build if they drift from themes.css.
        /* THEME-GROUNDS:GENERATED — scripts/gen-themes.mjs */
        var G = {"porcelain":["#F4F3F0","#0F0E0B"],"graphite":["#F3F2F2","#151514"],"lapis":["#E9EBF1","#07090D"],"slate":["#F3F5F6","#1F2329"],"forest":["#EDF2F0","#0D120F"],"claret":["#ECE4E6","#1E1517"],"ink":["#F7F8F8","#070808"],"navy":["#E6E9EF","#090C10"],"plum":["#EFEAF0","#1F1721"],"moss":["#E7EAE1","#13150F"],"copper":["#E9E2DD","#1C1612"],"teal":["#F0F4F5","#182325"],"iris":["#EDECF3","#0D0C13"],"arctic":["#F6F8F9","#202C32"],"ember":["#E3DFDD","#0B0A09"],"mono":["#F5F5F5","#080808"],"sand":["#EDE9E3","#28231A"],"rose":["#F1EEEF","#322A2D"],"pine":["#E0EBE8","#080D0B"],"oxide":["#E0DDDC","#292524"]};
        /* /THEME-GROUNDS */
        var g = G[pal] || G.porcelain;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m && g) m.setAttribute("content", t === "night" ? g[1] : g[0]);
      })();
    </script>
    <!-- Type: Inter (self-hosted, preloaded above) with the platform stack as
         the cold-cache fallback. One small variable file, same origin. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
